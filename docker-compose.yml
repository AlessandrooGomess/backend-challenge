services:
  db:
    image: postgres:17-alpine
    container_name: motiron-backend-challenge-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleet
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fleet']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
